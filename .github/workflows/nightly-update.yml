name: Nightly Data Update

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC every day
  workflow_dispatch:     # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Allow pushing commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No `cache: 'npm'` — that requires a committed lockfile and the
          # project's single devDep isn't worth the maintenance overhead.

      - name: Install dependencies
        run: npm install

      - name: Check if today is season end (May 31)
        id: check_season_end
        run: |
          today=$(date -u '+%m-%d')
          if [ "$today" = "05-31" ]; then
            echo "is_season_end=true" >> $GITHUB_OUTPUT
            echo "📅 Today is May 31 - running season-end automation"
          else
            echo "is_season_end=false" >> $GITHUB_OUTPUT
          fi

      - name: Run season-end handler
        if: steps.check_season_end.outputs.is_season_end == 'true'
        run: node scripts/handle-season-end.js
        continue-on-error: true

      - name: Fetch latest data from APIs
        if: steps.check_season_end.outputs.is_season_end != 'true'
        run: npm run fetch
        continue-on-error: true  # Continue even if fetch fails

      - name: Build HTML artifact
        run: npm run build

      - name: Check for data changes
        id: check_changes
        run: |
          if git diff --quiet data/ static/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No data changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Data changes detected"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@example.com"
          if [ "${{ steps.check_season_end.outputs.is_season_end }}" = "true" ]; then
            git add data/ static/league-promotions.json index.html
            git commit -m "chore: season-end update - new season structure + promotions"
          else
            git add data/ index.html
            git commit -m "chore: nightly data update"
          fi
          git push

      - name: Log run summary
        run: |
          echo "✅ Nightly update completed"
          echo "📅 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "📊 Changes: ${{ steps.check_changes.outputs.has_changes }}"
