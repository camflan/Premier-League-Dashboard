name: Fetch Historical Data

# Manual trigger for bulk historical data fetching
# Useful for fetching Championship/League One matches from past seasons
on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League to backfill'
        required: true
        default: 'championship'
        type: choice
        options:
          - premier-league
          - championship
          - efl-league-one
          - league-two
      from_season:
        description: 'Start season (e.g., 2003-04); backfills through the active season'
        required: true
        type: string

jobs:
  historical_fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Fetch historical data
        run: npm run sync -- --league=${{ github.event.inputs.league }} --from=${{ github.event.inputs.from_season }}

      - name: Validate data
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const dataDir = 'data/${{ github.event.inputs.league }}/matches';

            if (!fs.existsSync(dataDir)) {
              console.log('No matches directory created');
              process.exit(0);
            }

            const files = fs.readdirSync(dataDir);
            console.log(\`Found \${files.length} match files\`);

            let totalMatches = 0;
            for (const file of files) {
              try {
                const data = JSON.parse(fs.readFileSync(path.join(dataDir, file), 'utf8'));
                totalMatches += data.length;
                console.log(\`  \${file}: \${data.length} matches\`);
              } catch (e) {
                console.error(\`  ERROR in \${file}: \${e.message}\`);
              }
            }

            console.log(\`Total matches fetched: \${totalMatches}\`);
          "

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@anthropic.com"
          git add data/
          git commit -m "chore: historical fetch - ${{ github.event.inputs.league }} (from ${{ github.event.inputs.from_season }})"

      - name: Push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: git push

      - name: Create summary
        if: always()
        run: |
          echo "## Historical Data Fetch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Parameters" >> $GITHUB_STEP_SUMMARY
          echo "- League: ${{ github.event.inputs.league }}" >> $GITHUB_STEP_SUMMARY
          echo "- From season: ${{ github.event.inputs.from_season }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- Data changes: ${{ steps.check_changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Changes committed: ${{ steps.check_changes.outputs.changed == 'true' }}" >> $GITHUB_STEP_SUMMARY
